name: CI

# Only changes to the binaries, the image or the workflow exercised by jobs/default.yml are tested.
# Documentation, other job presets and the HPC scripts do not trigger a run.
on:
  push:
    branches: [main]
    paths: &tested-paths
      - "src/**"
      - "lib/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "Africapolis.cwl"
      - "cwl/**"
      - "jobs/default.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *tested-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: logru/africapolis
  CWLTOOL_VERSION: 3.1.20260108082145

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep -oP 'project\s*\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The build stage of the Dockerfile compiles and installs all binaries.
      # The image is loaded into the local daemon, so the CWL run below uses it
      # instead of pulling logru/africapolis:latest from Docker Hub.
      - name: Build binaries and Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test binaries
        run: |
          for bin in AfricapolisGraphConstruction AfricapolisGraphComponents AfricapolisSpatialClustering \
                     AfricapolisPolygonOutline AfricapolisEdgeVisualization AfricapolisMSTVisualization; do
            echo "::group::$bin"
            docker run --rm "$IMAGE:latest" "$bin" --help
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cwltool
        run: pip install "cwltool==$CWLTOOL_VERSION"

      - name: Validate workflow
        run: cwltool --validate Africapolis.cwl

      - name: Run example workflow (jobs/default.yml)
        run: cwltool --outdir ci-output Africapolis.cwl jobs/default.yml

      - name: Check outputs
        run: |
          for f in ci-output/Kahama_Small_Africapolis.gpkg ci-output/Kahama_Small_Africapolis_MultiPolygons.gpkg; do
            test -s "$f" || { echo "::error::Missing or empty output $f"; exit 1; }
          done
          ls -lh ci-output

      - name: Upload workflow outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africapolis-output
          path: ci-output/
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushes the exact image that passed the CWL run above.
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:latest"
