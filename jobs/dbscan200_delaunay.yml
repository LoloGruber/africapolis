# Delaunay graph construction with DBSCAN clustering at 200m.
#
#   cwltool Africapolis.cwl jobs/dbscan200_delaunay.yml
#
# Copy this file and point vectorFile (or shapefile) at your own input to run it on other
# data. A cwl job file describes a run completely, so every parameter of the run is set here
# and command line arguments cannot be added on top of it.

# --- Input data ---
vectorFile:
  class: File
  path: ../data/input/Kahama_Small.gpkg
partitionDepth: 1

# --- Parameters ---
graphConstructionMode: DELAUNAY
graphDistanceThreshold: 200.0
clusteringMode: DBSCAN
clusterDistanceThreshold: 200.0
minClusterSize: 3
